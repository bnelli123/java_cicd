
name: Java CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  IMAGE_NAME: java-cicd

jobs:

  # Stage 1: Build and Test
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and Test
        run: mvn --batch-mode clean verify

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-build
          path: target/
          if-no-files-found: error

  # Stage 2: Snyk SCA
  sca:
    name: Snyk SCA Scan
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Debug GitHub OIDC
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(`Repository: ${context.repo.owner}/${context.repo.repo}`);
            core.info(`OIDC Subject: ${claims.sub}`);
            core.info(`OIDC Audience: ${claims.aud}`);
            core.info(`OIDC Issuer: ${claims.iss}`);
            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                aws-region: ${{ env.AWS_REGION }}

      - name: Get Snyk Token
        uses: aws-actions/aws-secretsmanager-get-secrets@v3
        with:
          secret-ids: |
            SNYK_TOKEN,snyk-token

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk SCA Scan
        run: |
          snyk test \
            --file=pom.xml \
            --severity-threshold=critical

  # Stage 3: SonarQube
  sonarqube:
    name: SonarQube Analysis
    needs: sca
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: maven-build
          path: target/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get SonarQube Token
        uses: aws-actions/aws-secretsmanager-get-secrets@v3
        with:
          secret-ids: |
            SONAR_TOKEN,sonarqube-token

      - name: SonarQube Analysis
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true

  # Stage 4: Docker Build
  docker:
    name: Docker Build
    needs: sonarqube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Maven Build
        uses: actions/download-artifact@v4
        with:
          name: maven-build
          path: target/

      - name: Build Docker Image
        run: |
          docker build \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            .

      - name: Verify Docker Image
        run: |
          docker image inspect \
            "$IMAGE_NAME:${{ github.sha }}"
